# Persistent lagring for Bokami på Rook Ceph (RF2, reclaimPolicy: Retain, allowVolumeExpansion: true)
# bokami-data-ceph: Konfigurasjon, profiler, sesjoner, bokmerker og omslags-cache (liten, latensfølsom -> nvme-rbd)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bokami-data-ceph
  labels:
    app.kubernetes.io/name: bokami
    app.kubernetes.io/instance: bokami
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nvme-rbd
  resources:
    requests:
      storage: 2Gi
---
# bokami-books-ceph: Bøker (bildeserier, PDF og EPUB) på CephFS (fast-fs, ReadWriteMany)
# Kan monteres direkte med scripts/mount-cephfs.py --pvc bokami-books-ceph -n bokami
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bokami-books-ceph
  labels:
    app.kubernetes.io/name: bokami
    app.kubernetes.io/instance: bokami
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-fs
  resources:
    requests:
      storage: 20Gi
