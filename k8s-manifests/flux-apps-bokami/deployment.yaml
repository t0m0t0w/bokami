apiVersion: apps/v1
kind: Deployment
metadata:
  name: bokami
  labels:
    app.kubernetes.io/name: bokami
    app.kubernetes.io/instance: bokami
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # bokami-data-ceph er RWO: Unngå to samtidige pods ved rullende oppdatering
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bokami
      app.kubernetes.io/instance: bokami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bokami
        app.kubernetes.io/instance: bokami
    spec:
      automountServiceAccountToken: false
      # Kjør sikkert som standard node-bruker (uid 1000)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bokami
          # Docker-image bygget automatisk via GitHub Actions
          image: ghcr.io/t0m0t0w/bokami:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: Europe/Oslo
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: "/app/data"
            - name: BOOKS_DIR
              value: "/app/books"
            - name: TRUST_PROXY
              value: "true"
            # Valgfri Kubernetes Secret ("bokami-secrets") for faste passord.
            # Hvis Secreten mangler, bruker Bokami config.json / autogenererte passord.
            - name: BOKAMI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bokami-secrets
                  key: reader-password
                  optional: true
            - name: BOKAMI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bokami-secrets
                  key: admin-password
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: books
              mountPath: /app/books
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bokami-data-ceph
        - name: books
          persistentVolumeClaim:
            claimName: bokami-books-ceph
        - name: tmp
          emptyDir: {}
