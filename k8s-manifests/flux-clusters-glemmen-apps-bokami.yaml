# Bokami - Flux Kustomization for Glemmen Fleet (Rook Ceph nvme-rbd + CephFS fast-fs)
# Plasseres i: flux/clusters/glemmen/apps/bokami.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bokami
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/bokami
  prune: true
  wait: true
  targetNamespace: bokami
  dependsOn:
    - name: infrastructure
    - name: rook-ceph
  sourceRef:
    kind: GitRepository
    name: flux-system
